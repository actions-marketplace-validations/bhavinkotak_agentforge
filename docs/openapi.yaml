openapi: "3.1.0"
info:
  title: AgentForge API
  description: |
    REST API for the AgentForge AI agent optimization platform.
    Manage agent versions, start eval runs, retrieve results, diff versions, and promote champions.
  version: "1.0.0"
  license:
    name: MIT
    url: https://github.com/bhavinkotak/agentforge/blob/main/LICENSE

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: agents
    description: Agent version management
  - name: runs
    description: Evaluation run lifecycle
  - name: diff
    description: Scorecard comparison between agent versions
  - name: promote
    description: Champion promotion
  - name: shadow
    description: Online / shadow eval runs (v2)
  - name: finetune
    description: Fine-tune export (v2)
  - name: benchmarks
    description: Public benchmark suites (v2)
  - name: health
    description: Service health

paths:
  /health:
    get:
      tags: [health]
      summary: Service health check
      operationId: health
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/agents:
    get:
      tags: [agents]
      summary: List registered agent versions
      description: Returns a paginated list of all agent versions ordered by creation time (newest first).
      operationId: listAgents
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of agent versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentVersion"
    post:
      tags: [agents]
      summary: Upload and register a new agent version
      description: |
        Accepts raw agent file content (YAML, JSON, or .agent.md format).
        SHA-based deduplication: returns 200 OK with the existing record if the same
        file was already uploaded; returns 201 Created otherwise.
      operationId: createAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: Raw agent file content (YAML, JSON, or Markdown)
      responses:
        "201":
          description: Agent version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentVersion"
        "200":
          description: Agent version already exists (same SHA)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentVersion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/agents/{id}:
    get:
      tags: [agents]
      summary: Get agent version by ID
      operationId: getAgent
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Agent version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentVersion"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [agents]
      summary: Delete an agent version
      description: |
        Permanently deletes the agent version. Returns 409 if the version is
        the current champion — promote a different version first.
      operationId: deleteAgent
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "204":
          description: Deleted successfully
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Cannot delete champion version

  /api/v1/runs:
    get:
      tags: [runs]
      summary: List all eval runs
      description: Returns a paginated list of all eval runs ordered by creation time (newest first).
      operationId: listRuns
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of eval runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvalRun"
    post:
      tags: [runs]
      summary: Start a new evaluation run
      description: |
        Queues an evaluation run in the background and returns 202 immediately.
        Rejected with 422 when the number of active background runs reaches
        `AGENTFORGE_MAX_CONCURRENT_RUNS` (default 10).
      operationId: startRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRunRequest"
      responses:
        "202":
          description: Eval run accepted and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Too many concurrent runs — retry after an existing run finishes
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/runs/{id}:
    get:
      tags: [runs]
      summary: Get run status and results
      operationId: getRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Eval run record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalRun"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [runs]
      summary: Cancel an in-progress eval run
      description: |
        Transitions a pending or running eval run to `cancelled`. No-op if the
        run has already completed or errored. Returns 404 if the run ID does not
        exist.
      operationId: cancelRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "204":
          description: Cancelled successfully
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/runs/{id}/scorecard:
    get:
      tags: [runs]
      summary: Get full scorecard for a completed run
      operationId: getScorecard
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Scorecard with dimension scores and failure clusters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scorecard"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/runs/{id}/traces:
    get:
      tags: [runs]
      summary: List traces for a run (paginated)
      description: Returns a paginated list of traces. Default limit 100, maximum 500 per request.
      operationId: listTraces
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of traces
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/diff:
    get:
      tags: [diff]
      summary: Scorecard diff between two agent versions
      operationId: getDiff
      parameters:
        - name: v1
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: First agent version ID
        - name: v2
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Second agent version ID
      responses:
        "200":
          description: Scorecard diff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScorecardDiff"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/promote/{run_id}:
    post:
      tags: [promote]
      summary: Promote a run's agent version to champion
      description: |
        Runs the three-gate promotion logic (score gate, regression gate, stability gate)
        against the current champion. On first run (no champion), all gates are waived.
      operationId: promoteRun
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Promotion decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionDecision"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Run is not in a promotable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/shadow-runs:
    post:
      tags: [shadow]
      summary: Start a shadow (online eval) run
      operationId: startShadowRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartShadowRunRequest"
      responses:
        "202":
          description: Shadow run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShadowRun"

  /api/v1/shadow-runs/{id}:
    get:
      tags: [shadow]
      summary: Get shadow run status and comparison
      operationId: getShadowRun
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Shadow run record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShadowRun"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/exports/finetune:
    post:
      tags: [finetune]
      summary: Start a fine-tune export job
      operationId: startFineTuneExport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartExportRequest"
      responses:
        "202":
          description: Export job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJob"

  /api/v1/exports/finetune/{id}:
    get:
      tags: [finetune]
      summary: Get fine-tune export job status
      operationId: getFineTuneExport
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Export job record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJob"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/benchmarks:
    post:
      tags: [benchmarks]
      summary: Start a public benchmark run
      operationId: startBenchmark
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartBenchmarkRequest"
      responses:
        "202":
          description: Benchmark run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkRun"

  /api/v1/benchmarks/{id}:
    get:
      tags: [benchmarks]
      summary: Get benchmark run results
      operationId: getBenchmark
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Benchmark run record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkRun"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    AgentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Agent version UUID
    RunId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Eval run UUID

  responses:
    BadRequest:
      description: Invalid request body or parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    ApiError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: not_found
        message:
          type: string
          example: "Agent abc123 not found"

    AgentVersion:
      type: object
      required: [id, name, version, sha, format, promoted, is_champion, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: customer-support-agent
        version:
          type: string
          example: "2.1.0"
        sha:
          type: string
          description: SHA-256 hash of the agent file content
          example: "a1b2c3d4e5f6..."
        format:
          type: string
          enum: [native_yaml, copilot_agent_md, openai_json, anthropic_json, langchain_yaml, crewai_yaml]
        promoted:
          type: boolean
        is_champion:
          type: boolean
        created_at:
          type: string
          format: date-time

    StartRunRequest:
      type: object
      required: [agent_id]
      properties:
        agent_id:
          type: string
          format: uuid
        scenario_count:
          type: integer
          default: 100
          minimum: 1
          maximum: 2000
        concurrency:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
        seed:
          type: integer
          default: 42

    EvalRun:
      type: object
      required: [id, agent_id, status, scenario_count, seed, created_at]
      properties:
        id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, running, complete, failed]
        scenario_count:
          type: integer
        completed_count:
          type: integer
        error_count:
          type: integer
        aggregate_score:
          type: number
          nullable: true
        pass_rate:
          type: number
          nullable: true
        seed:
          type: integer
        concurrency:
          type: integer
        error_message:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    DimensionScores:
      type: object
      properties:
        task_completion:
          type: number
          description: "Weight: 35%"
        tool_selection:
          type: number
          description: "Weight: 20%"
        argument_correctness:
          type: number
          description: "Weight: 20%"
        schema_compliance:
          type: number
          description: "Weight: 15%"
        instruction_adherence:
          type: number
          description: "Weight: 7%"
        path_efficiency:
          type: number
          description: "Weight: 3%"

    FailureClusterSummary:
      type: object
      properties:
        cluster:
          type: string
          enum: [wrong_tool, hallucinated_argument, looping, premature_stop, schema_violation, constraint_breach]
        count:
          type: integer
        percentage:
          type: number

    Scorecard:
      type: object
      properties:
        run_id:
          type: string
          format: uuid
        agent_name:
          type: string
        agent_version:
          type: string
        aggregate_score:
          type: number
        pass_rate:
          type: number
        passed:
          type: integer
        total_scenarios:
          type: integer
        dimension_scores:
          $ref: "#/components/schemas/DimensionScores"
        failure_clusters:
          type: array
          items:
            $ref: "#/components/schemas/FailureClusterSummary"
        duration_seconds:
          type: number
        total_input_tokens:
          type: integer
        total_output_tokens:
          type: integer

    ScorecardDiff:
      type: object
      properties:
        v1_id:
          type: string
          format: uuid
        v2_id:
          type: string
          format: uuid
        aggregate_delta:
          type: number
          description: v2 aggregate score minus v1 aggregate score
        dimension_deltas:
          $ref: "#/components/schemas/DimensionScores"
        regression_count:
          type: integer
          description: Number of scenarios v2 fails that v1 passed

    GateResult:
      type: object
      properties:
        gate:
          type: string
          enum: [Score Gate, Regression Gate, Stability Gate]
        status:
          type: string
          enum: [Pass, Fail, Waived]
        message:
          type: string
        delta:
          type: number
          nullable: true

    PromotionDecision:
      type: object
      properties:
        run_id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        approved:
          type: boolean
        gates:
          type: array
          items:
            $ref: "#/components/schemas/GateResult"
        changelog:
          type: string

    StartShadowRunRequest:
      type: object
      required: [champion_agent_id, candidate_agent_id]
      properties:
        champion_agent_id:
          type: string
          format: uuid
        candidate_agent_id:
          type: string
          format: uuid
        traffic_percent:
          type: integer
          default: 10
          minimum: 1
          maximum: 100

    ShadowRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        champion_agent_id:
          type: string
          format: uuid
        candidate_agent_id:
          type: string
          format: uuid
        traffic_percent:
          type: integer
        status:
          type: string
          enum: [pending, running, complete, failed]
        created_at:
          type: string
          format: date-time

    StartExportRequest:
      type: object
      required: [run_id]
      properties:
        run_id:
          type: string
          format: uuid
        format:
          type: string
          enum: [openai, anthropic, huggingface]
          default: openai

    ExportJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        format:
          type: string
        status:
          type: string
          enum: [pending, running, complete, failed]
        row_count:
          type: integer
          nullable: true
        file_path:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    StartBenchmarkRequest:
      type: object
      required: [agent_id, suite]
      properties:
        agent_id:
          type: string
          format: uuid
        suite:
          type: string
          enum: [gaia, agentbench, webarena]

    BenchmarkRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        suite:
          type: string
        total_tasks:
          type: integer
        correct:
          type: integer
        accuracy:
          type: number
        percentile_rank:
          type: number
          nullable: true
        status:
          type: string
          enum: [pending, running, complete, failed]
        created_at:
          type: string
          format: date-time
