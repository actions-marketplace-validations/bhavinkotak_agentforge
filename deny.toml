[graph]
# All features enabled
all-features = false

[advisories]
version = 2
ignore = [
    # rsa 0.9.x Marvin Attack timing side-channel.
    # Transitive dep via sqlx-mysql (pulled in by sqlx proc-macro crate at build time).
    # AgentForge only uses the postgres runtime feature; RSA is never invoked.
    # No upstream fix is available. Tracked: https://github.com/RustCrypto/RSA/issues/19
    { id = "RUSTSEC-2023-0071" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "OpenSSL",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
