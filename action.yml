name: 'AgentForge Eval'
description: 'Evaluate AI agents: generate scenarios, run traces, score results, and gate promotion. One agent file in, better agent out.'
author: 'AgentForge'

branding:
  icon: 'activity'
  color: 'purple'

inputs:
  agent_file:
    description: 'Path to the agent file (YAML, JSON, or .agent.md)'
    required: true
  scenarios:
    description: 'Number of test scenarios to generate'
    required: false
    default: '100'
  concurrency:
    description: 'Number of parallel workers for running scenarios'
    required: false
    default: '10'
  seed:
    description: 'Random seed for reproducible scenario generation'
    required: false
    default: '42'
  threshold:
    description: 'Minimum aggregate pass score to gate promotion (0.0–1.0)'
    required: false
    default: '0.85'
  provider:
    description: |
      LLM provider for the agent under test: openai | anthropic | nvidia.
      Note: ollama and bedrock providers require a self-hosted runner with local
      access and are not supported in GitHub-hosted runners via this action.
    required: false
    default: 'openai'
  judge_provider:
    description: |
      LLM provider for the judge (must differ from agent provider): openai | anthropic | nvidia.
      Note: ollama and bedrock are not supported in GitHub-hosted runners via this action.
    required: false
    default: 'anthropic'
  version:
    description: 'AgentForge release version to use (e.g. v1.2.3). Defaults to the version of this action.'
    required: false
    default: ''

outputs:
  pass_rate:
    description: 'Aggregate pass rate across all evaluated scenarios (0.0–1.0)'
    value: ${{ steps.run-eval.outputs.pass_rate }}
  aggregate_score:
    description: 'Weighted aggregate score across all six dimensions (0.0–1.0)'
    value: ${{ steps.run-eval.outputs.aggregate_score }}
  promoted:
    description: 'Whether the agent was promoted to champion ("true" | "false")'
    value: ${{ steps.run-eval.outputs.promoted }}
  scorecard_path:
    description: 'Path to the JSON scorecard artifact'
    value: ${{ steps.run-eval.outputs.scorecard_path }}
  run_id:
    description: 'AgentForge eval run UUID'
    value: ${{ steps.run-eval.outputs.run_id }}

runs:
  using: 'composite'
  steps:
    - name: Set up AgentForge CLI
      id: setup
      shell: bash
      run: |
        REPO="bhavinkotak/agentforge"

        # Prefer an explicit version input; fall back to the action ref.
        # github.action_ref may be a branch/tag alias (e.g. "v1"), not a
        # semver release tag.  When it is not a semver we query the GitHub
        # API to resolve the latest matching release so the asset name is
        # always correct.
        REQUESTED_VERSION="${{ inputs.version }}"
        if [ -z "$REQUESTED_VERSION" ]; then
          REQUESTED_VERSION="${{ github.action_ref }}"
        fi

        # If the requested version looks like a semver tag, use it directly.
        # Otherwise (e.g. "v1", "main") resolve to the latest release.
        if echo "$REQUESTED_VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]'; then
          VERSION="$REQUESTED_VERSION"
        else
          echo "Resolving latest release for ref '${REQUESTED_VERSION}'…"
          VERSION=$(curl -fsSL \
            "https://api.github.com/repos/${REPO}/releases/latest" \
            | grep '"tag_name"' \
            | sed 's/.*"tag_name": *"\([^"]*\)".*/\1/')
          echo "Resolved to ${VERSION}"
        fi

        OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
        ARCH="$(uname -m)"
        case "$ARCH" in
          x86_64) ARCH="x86_64" ;;
          aarch64|arm64) ARCH="aarch64" ;;
        esac

        ASSET="agentforge-${OS}-${ARCH}.tar.gz"
        DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${VERSION}/${ASSET}"

        echo "Downloading AgentForge ${VERSION} from ${DOWNLOAD_URL}"
        curl -fsSL "$DOWNLOAD_URL" -o /tmp/agentforge.tar.gz
        tar -xzf /tmp/agentforge.tar.gz -C /tmp
        # Handle archives that contain a subdirectory (e.g. agentforge-linux-x86_64/agentforge)
        if [ ! -f /tmp/agentforge ]; then
          EXTRACTED=$(find /tmp -maxdepth 2 -name 'agentforge' -type f | head -1)
          [ -n "$EXTRACTED" ] && mv "$EXTRACTED" /tmp/agentforge
        fi
        chmod +x /tmp/agentforge
        echo "/tmp" >> "$GITHUB_PATH"

    - name: Run AgentForge evaluation
      id: run-eval
      shell: bash
      env:
        OPENAI_API_KEY: ${{ env.OPENAI_API_KEY }}
        ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_API_KEY }}
        NVIDIA_API_KEY: ${{ env.NVIDIA_API_KEY }}
        DATABASE_URL: ${{ env.DATABASE_URL }}
      run: |
        set +e
        agentforge run \
          --agent "${{ inputs.agent_file }}" \
          --scenarios "${{ inputs.scenarios }}" \
          --concurrency "${{ inputs.concurrency }}" \
          --seed "${{ inputs.seed }}" \
          --provider "${{ inputs.provider }}" \
          --judge-provider "${{ inputs.judge_provider }}" \
          --threshold "${{ inputs.threshold }}" \
          --output-json /tmp/agentforge-scorecard.json
        EXIT_CODE=$?
        set -e

        # Parse scorecard outputs
        if [ -f /tmp/agentforge-scorecard.json ]; then
          PASS_RATE=$(jq -r '.pass_rate // "0"' /tmp/agentforge-scorecard.json)
          AGG_SCORE=$(jq -r '.aggregate_score // "0"' /tmp/agentforge-scorecard.json)
          PROMOTED=$(jq -r '.promoted // "false"' /tmp/agentforge-scorecard.json)
          RUN_ID=$(jq -r '.run_id // ""' /tmp/agentforge-scorecard.json)
          echo "pass_rate=${PASS_RATE}" >> "$GITHUB_OUTPUT"
          echo "aggregate_score=${AGG_SCORE}" >> "$GITHUB_OUTPUT"
          echo "promoted=${PROMOTED}" >> "$GITHUB_OUTPUT"
          echo "scorecard_path=/tmp/agentforge-scorecard.json" >> "$GITHUB_OUTPUT"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
        fi

        # Propagate exit code: 0=passed/promoted, 1=gatekeeper blocked, 2=error
        exit $EXIT_CODE

    - name: Upload scorecard artifact
      if: always()
      shell: bash
      run: |
        if [ -f /tmp/agentforge-scorecard.json ]; then
          mkdir -p "${{ github.workspace }}/.agentforge"
          cp /tmp/agentforge-scorecard.json "${{ github.workspace }}/.agentforge/scorecard.json"
          echo "Scorecard saved to .agentforge/scorecard.json"
          cat /tmp/agentforge-scorecard.json
        fi

    - name: Post scorecard summary as PR comment
      if: github.event_name == 'pull_request' && always()
      shell: bash
      env:
        GH_TOKEN: ${{ env.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        if [ -z "$GH_TOKEN" ] || [ ! -f /tmp/agentforge-scorecard.json ]; then
          echo "Skipping PR comment (no GITHUB_TOKEN or no scorecard)"
          exit 0
        fi
        PASS_RATE=$(jq -r '.pass_rate // "0"' /tmp/agentforge-scorecard.json)
        AGG=$(jq -r '.aggregate_score // "0"' /tmp/agentforge-scorecard.json)
        PROMOTED=$(jq -r '.promoted // "false"' /tmp/agentforge-scorecard.json)
        RUN_ID=$(jq -r '.run_id // ""' /tmp/agentforge-scorecard.json)
        STATUS_ICON=$([ "$PROMOTED" = "true" ] && echo "✅" || echo "❌")
        # $'\n' gives a real newline — required so GitHub Markdown renders the table
        NL=$'\n'
        BODY="## AgentForge Scorecard ${STATUS_ICON}${NL}${NL}"
        BODY+="| Metric | Value |${NL}|--------|-------|${NL}"
        BODY+="| Aggregate Score | ${AGG} |${NL}"
        BODY+="| Pass Rate | ${PASS_RATE} |${NL}"
        BODY+="| Promoted | ${PROMOTED} |${NL}"
        BODY+="| Run ID | \`${RUN_ID}\` |${NL}"
        curl -fsSL -X POST \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"body\": $(printf '%s' "$BODY" | jq -Rs .)}" \
          "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments" \
          > /dev/null
        echo "PR comment posted."
